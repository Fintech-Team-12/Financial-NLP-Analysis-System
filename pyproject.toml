[tool.pytest.ini_options]
minversion = "7.0"
# 주의: app/api/tests 는 여기 포함하지 않는다. app/api 내부 pytest.ini 를 통해
# 독립적인 rootdir 로 실행되도록 격리돼 있으며(nested app/api/app 네이밍 충돌 회피),
# CI 에서는 `pytest app/api/tests` 를 별도로 실행한다.
testpaths = ["app/ingest/tests", "chroma/test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = [
    "chroma_store",
    "data",
    "docs",
    "scripts",
    ".git",
    ".venv",
    ".venv_api",
    ".venv_ingest",
    "node_modules",
]
