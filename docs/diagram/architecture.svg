<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1250" width="1200" height="1250" style="background-color: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
        </filter>
        <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6" />
        </marker>
        <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#14B8A6" />
        </marker>
        <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B" />
        </marker>
        <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B" />
        </marker>
        <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#EF4444" />
        </marker>
        <linearGradient id="claudeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#2D3748" />
            <stop offset="100%" stop-color="#1A202C" />
        </linearGradient>
    </defs>

    <!-- Background Matrix -->
    <rect width="100%" height="100%" fill="#F8FAFC" />
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1" fill="#E2E8F0" />
    </pattern>
    <rect width="100%" height="100%" fill="url(#grid)" />

    <!-- Title -->
    <text x="600" y="60" font-size="34" font-weight="800" fill="#0F172A" text-anchor="middle">Financial NLP Analysis System</text>
    <text x="600" y="90" font-size="16" font-weight="500" fill="#64748B" text-anchor="middle">Technical Architecture &amp; Data Pipeline</text>

    <!-- User Node -->
    <rect x="520" y="110" width="160" height="50" rx="25" fill="#1E293B" filter="url(#shadow)" />
    <text x="600" y="142" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">👤 Users</text>

    <!-- ============================================== -->
    <!-- PRIMARY BOXES -->
    <!-- ============================================== -->
    <rect x="150" y="200" width="900" height="180" rx="16" fill="#F0FDFA" stroke="#14B8A6" stroke-width="2" />
    <text x="600" y="235" font-size="20" font-weight="700" fill="#0D9488" text-anchor="middle">Frontend (React / Vite)</text>

    <rect x="60" y="460" width="760" height="680" rx="16" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" />
    <text x="440" y="495" font-size="20" font-weight="700" fill="#1D4ED8" text-anchor="middle">Backend Engine (FastAPI)</text>

    <rect x="860" y="460" width="280" height="680" rx="16" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" />
    <text x="1000" y="495" font-size="20" font-weight="700" fill="#B45309" text-anchor="middle">Offline Data Pipeline</text>

    <!-- ============================================== -->
    <!-- CONNECTIONS -->
    <!-- ============================================== -->
    
    <!-- User to Frontend -->
    <path d="M 600 160 C 600 200, 400 200, 400 260" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow-gray)" />
    <path d="M 600 160 C 600 200, 800 200, 800 260" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow-gray)" />

    <!-- Frontend to API -->
    <path d="M 400 360 C 400 450, 240 450, 240 530" fill="none" stroke="#14B8A6" stroke-width="4" marker-end="url(#arrow-green)" />
    <path d="M 800 360 C 800 450, 620 450, 620 530" fill="none" stroke="#14B8A6" stroke-width="4" marker-end="url(#arrow-green)" />

    <!-- API to Handlers -->
    <path d="M 240 590 L 240 650" fill="none" stroke="#3B82F6" stroke-width="3" marker-end="url(#arrow-blue)" />
    <path d="M 620 590 L 620 650" fill="none" stroke="#3B82F6" stroke-width="3" marker-end="url(#arrow-blue)" />

    <!-- Parser to InMemory -->
    <path d="M 240 730 L 240 790" fill="none" stroke="#3B82F6" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-blue)" />

    <!-- Query Router to DBs (RAG Flow) -->
    <!-- Router to In-Memory (Exact Match) -->
    <path d="M 480 690 C 380 690, 320 730, 320 790" fill="none" stroke="#3B82F6" stroke-width="3" marker-end="url(#arrow-blue)" />
    <text x="360" y="730" font-size="12" font-weight="600" fill="#1D4ED8" text-anchor="middle">Numeric/Note (Exact)</text>
    
    <!-- Router to ChromaDB (Semantic Search) -->
    <path d="M 620 750 L 620 790" fill="none" stroke="#3B82F6" stroke-width="3" marker-end="url(#arrow-blue)" />
    <text x="680" y="775" font-size="12" font-weight="600" fill="#1D4ED8" text-anchor="middle">Semantic (Vector)</text>

    <!-- DBs to Claude -->
    <path d="M 240 890 C 240 950, 350 950, 350 1000" fill="none" stroke="#3B82F6" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-blue)" />
    <path d="M 620 890 C 620 950, 530 950, 530 1000" fill="none" stroke="#3B82F6" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-blue)" />

    <!-- Offline Steps -->
    <path d="M 1000 610 L 1000 660" fill="none" stroke="#F59E0B" stroke-width="3" marker-end="url(#arrow-orange)" />
    <path d="M 1000 720 L 1000 750" fill="none" stroke="#F59E0B" stroke-width="3" marker-end="url(#arrow-orange)" />
    <path d="M 1000 810 L 1000 870" fill="none" stroke="#F59E0B" stroke-width="3" marker-end="url(#arrow-orange)" />

    <!-- STARTUP MAGIC ARROWS (Startup / Auto-ingest) -->
    <!-- Raw HTML to Parser -->
    <path d="M 890 570 C 750 570, 750 690, 380 690" fill="none" stroke="#EF4444" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrow-red)" />
    <rect x="710" y="618" width="70" height="24" fill="#FEE2E2" rx="12" />
    <text x="745" y="634" font-size="11" font-weight="700" fill="#EF4444" text-anchor="middle">Startup</text>

    <!-- Pre-processed DBs to ChromaDB -->
    <path d="M 890 920 C 800 920, 800 840, 760 840" fill="none" stroke="#EF4444" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrow-red)" />
    <rect x="790" y="870" width="70" height="24" fill="#FEE2E2" rx="12" />
    <text x="825" y="886" font-size="11" font-weight="700" fill="#EF4444" text-anchor="middle">Startup</text>

    <!-- ============================================== -->
    <!-- COMPONENTS inside FRONTEND -->
    <!-- ============================================== -->
    <!-- File Upload -->
    <rect x="250" y="260" width="300" height="100" rx="12" fill="#FFFFFF" stroke="#CCFBF1" stroke-width="2" filter="url(#shadow)" />
    <text x="400" y="305" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">📂 File Upload UI</text>
    <rect x="300" y="325" width="200" height="12" rx="6" fill="#F1F5F9" />

    <!-- Chat UI -->
    <rect x="650" y="260" width="300" height="100" rx="12" fill="#FFFFFF" stroke="#CCFBF1" stroke-width="2" filter="url(#shadow)" />
    <text x="800" y="305" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">💬 Chat Interface</text>
    <rect x="690" y="325" width="120" height="16" rx="8" fill="#F1F5F9" />
    <rect x="820" y="325" width="90" height="16" rx="8" fill="#14B8A6" />


    <!-- ============================================== -->
    <!-- COMPONENTS inside BACKEND -->
    <!-- ============================================== -->
    <!-- API Section -->
    <rect x="100" y="530" width="280" height="60" rx="12" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="2" filter="url(#shadow)" />
    <text x="240" y="565" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">POST /api/files/upload</text>
    
    <rect x="480" y="530" width="280" height="60" rx="12" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="2" filter="url(#shadow)" />
    <text x="620" y="565" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">POST /api/chats</text>

    <!-- Logic Section -->
    <rect x="100" y="650" width="280" height="80" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)" />
    <text x="240" y="685" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">⚙️ Document Parser</text>
    <text x="240" y="710" font-size="13" font-weight="500" fill="#64748B" text-anchor="middle">HTML ➔ Structured JSON</text>

    <!-- Query Router (RAG Detail) -->
    <rect x="480" y="650" width="280" height="100" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)" />
    <text x="620" y="680" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">🧠 Query Router</text>
    <text x="620" y="700" font-size="13" font-weight="500" fill="#64748B" text-anchor="middle">(answering.py)</text>
    <text x="620" y="725" font-size="12" font-weight="600" fill="#3B82F6" text-anchor="middle">Identifies Question Target:</text>
    <text x="620" y="740" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Numeric Search vs Semantic Doc</text>

    <!-- Databases -->
    <rect x="100" y="790" width="280" height="100" rx="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" filter="url(#shadow)" />
    <text x="240" y="830" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">⚡ In-Memory Store</text>
    <text x="240" y="855" font-size="13" font-weight="500" fill="#64748B" text-anchor="middle">App Dictionary Cache</text>
    <text x="240" y="875" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">(Temporary/Instant Fetch)</text>

    <rect x="480" y="790" width="280" height="100" rx="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" filter="url(#shadow)" />
    <text x="620" y="830" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">📦 ChromaDB</text>
    <text x="620" y="855" font-size="13" font-weight="500" fill="#64748B" text-anchor="middle">Vector Text &amp; Table DB</text>
    <text x="620" y="875" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">(Persistent Semantic Fetch)</text>

    <!-- Claude AI Box -->
    <rect x="260" y="1000" width="360" height="90" rx="45" fill="url(#claudeGrad)" filter="url(#shadow)" />
    <text x="440" y="1040" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">✨ Claude Sonnet (Anthropic)</text>
    <text x="440" y="1065" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle">Answers via Synthesized Context (RAG)</text>


    <!-- ============================================== -->
    <!-- COMPONENTS inside OFFLINE -->
    <!-- ============================================== -->
    <rect x="890" y="530" width="220" height="80" rx="8" fill="#FFFFFF" stroke="#FEF3C7" stroke-width="2" filter="url(#shadow)" />
    <text x="1000" y="565" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">📄 Raw HTML (.htm)</text>
    <text x="1000" y="590" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">10 years of audit reports</text>

    <!-- Batch Scripts -->
    <rect x="890" y="660" width="220" height="60" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="1000" y="685" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">⚙️ json_to_sqlite.py</text>
    <text x="1000" y="705" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Structured Flattening</text>

    <rect x="890" y="750" width="220" height="60" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="1000" y="775" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">⚙️ enrich_flatten.py</text>
    <text x="1000" y="795" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">LLM Meta &amp; Tiktoken Tagging</text>

    <rect x="890" y="870" width="220" height="100" rx="12" fill="#FFFFFF" stroke="#FEF3C7" stroke-width="2" filter="url(#shadow)" />
    <text x="1000" y="910" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">🛢️ Pre-processed Data</text>
    <text x="1000" y="930" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">sqlite_by_year / *.db</text>
    <text x="1000" y="950" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">enriched_data / *.json</text>

</svg>
