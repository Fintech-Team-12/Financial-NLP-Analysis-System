# .github/workflows/cd.yml
name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/api/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}/finance-rag-api:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}/finance-rag-frontend:latest

      - name: Build and push ingest
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/ingest/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}/finance-rag-ingest:latest

# ghcr에 push된 이미지 저장소 이름은 repository의 소문자 이름으로 설정.