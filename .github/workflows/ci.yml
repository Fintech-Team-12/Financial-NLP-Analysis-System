# .github/workflows/ci.yml
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('app/api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/api/requirements.txt

      - name: Ruff
        run: ruff check app/api/app app/api/tests

      - name: Pytest
        run: pytest app/api/tests --cov=app/api/app --cov-report=term-missing
        env:
          PYTHONPATH: app/api

  docker-build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate compose file
        run: docker compose config

      - name: Build api image
        run: docker build -f app/api/Dockerfile -t finance-rag-api:ci .

      - name: Build frontend image
        run: docker build -f app/frontend/Dockerfile -t finance-rag-frontend:ci .

      - name: Build ingest image
        run: docker build -f app/ingest/Dockerfile -t finance-rag-ingest:ci .